[package]
name = "vaahapp-agent"
version = "0.4.1"
edition = "2021"
description = "vaahapp monitoring agent: pushes server metrics to app.vaah.ru"
license = "MIT"
repository = "https://github.com/vaahru/vaahapp-agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
flate2 = "1"
libc = "0.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
